name: Database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/check-*.mjs"
      - "scripts/pin-postgres-image.mjs"
      - "src/lib/db/**"
      - ".github/workflows/db.yml"
      - "package*.json"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/check-*.mjs"
      - "scripts/pin-postgres-image.mjs"
      - "src/lib/db/**"
      - ".github/workflows/db.yml"
      - "package*.json"

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: "Database: migrations, RLS, drift"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Pin the Postgres image
        run: node scripts/pin-postgres-image.mjs
      - name: Start Supabase (applies migrations and seed)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Every table has RLS and a policy
        run: npm run check:rls
      - name: pgTAP RLS tests
        run: npm run db:test
      - name: No schema drift
        run: npm run check:schema
      - name: No generated types drift
        run: npm run check:types
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
