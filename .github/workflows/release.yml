name: Release

# Story 8.5 (AR22, NFR35): production release after CI passes on main.
# 1. migrate: `supabase db push` to the cloud project (ap-southeast-2).
# 2. deploy:  Vercel production build and deploy (syd1, vercel.json).
# 3. verify:  /api/health on the production URL answers 200.
# Each job skips itself (and says so) until its secrets are set, so CI stays
# green before the cloud projects exist. See docs/release.md for the secrets.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  migrate:
    name: "Migrate: supabase db push"
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - id: secrets
        name: Secrets present?
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets are not set: migrations skipped (docs/release.md)."
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.121.0
      - name: Link the production project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

  deploy:
    name: "Deploy: Vercel production"
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - id: secrets
        name: Secrets present?
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] && [ "${{ needs.migrate.outputs.ready }}" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel or Supabase secrets are not set: deploy skipped (docs/release.md)."
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pull the production settings
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes vercel@65.12.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes vercel@65.12.1 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes vercel@65.12.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  verify:
    name: "Verify: production health"
    needs: deploy
    if: needs.deploy.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: /api/health answers 200
        run: |
          if [ -z "$PRODUCTION_URL" ]; then echo "::warning::PRODUCTION_URL is not set (repository variable)."; exit 0; fi
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$PRODUCTION_URL/api/health" || true)
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            echo "attempt $i: $code"; sleep 10
          done
          echo "::error::$PRODUCTION_URL/api/health did not answer 200"; exit 1
