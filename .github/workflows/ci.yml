name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependencies are pinned
        run: npm run check:pinned
      - name: No tracked .env files
        run: npm run check:env-files
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # Proves next build works without Sentry secrets (no DSN, no auth token,
      # no source-map upload). The Supabase values are placeholders, not secrets.
      - name: Build (no Sentry secrets)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:56321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      - name: Static route guard
        run: npm run check:dynamic-routes
      - name: Audit runtime dependencies
        # High/critical fail, except the advisories accepted (with a reason and a review date) in the script.
        run: node scripts/audit-runtime.mjs
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high || true

  e2e:
    name: Playwright e2e (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Pin the Postgres image
        run: node scripts/pin-postgres-image.mjs
      - name: Start Supabase (applies migrations and seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      # Local keys are generated per run; no repository secrets are involved.
      - name: Export local Supabase env
        run: node scripts/supabase-env.mjs --github-env
      # The browser first; its system packages next, with a time limit: when the Ubuntu archives
      # cannot be reached (2026-11-11/12: DNS failures for hours) apt retries until the job times
      # out, and the runner image already carries the libraries Chromium needs.
      - name: Install Chromium
        run: |
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium || echo "::warning::Chromium system packages were not installed (package archive unreachable); using the runner image's libraries."
      # e2e runs against the production build (real CSP, static pdf.js assets).
      - name: Build
        run: npm run build
      - name: Playwright e2e (production build)
        run: npm run e2e
        env:
          E2E_PROD: "1"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -O "${base}/${archive}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .
